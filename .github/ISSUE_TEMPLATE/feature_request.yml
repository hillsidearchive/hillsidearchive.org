name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["feature", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Archive
        - Chat
        - Search
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
