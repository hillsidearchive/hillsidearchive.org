name: Bug report
description: Something on the site or in the chat does not work.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Archive
        - Chat
        - Search
        - Other
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://hillsidearchive.org/...
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the steps that lead to the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox 140 on Windows, Safari on iPhone
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here.
